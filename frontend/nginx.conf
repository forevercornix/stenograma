# Stenograma frontend nginx konfigūracija su /api proxy į backendą.
#
# KODĖL PROXY: kai frontend'as kviečia santykinį "/api/..." (VITE_BACKEND_URL=""),
# nginx tą kelią persiunčia backendui. Nauda:
#   - JOKIO CORS (naršyklei viskas ta pati kilmė);
#   - JOKIO build-time domeno - tas pats frontend image tinka bet kuriam domenui
#     (localhost, RunPod proxy, serveris) be perbuildinimo;
#   - raktų/headerių logika lieka toje pačioje kilmėje.
#
# Backend adresas konfigūruojamas per aplinkos kintamuosius BACKEND_HOST/BACKEND_PORT
# (numatyta backend:3001 - Docker Compose serviso vardas). Dockerfile per envsubst
# įrašo juos į šį šabloną paleidimo metu.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statinis frontend'as (SPA - visi ne-/api keliai grąžina index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api proxy į backendą. ${BACKEND_HOST}/${BACKEND_PORT} pakeičiami envsubst
    # paleidimo metu (žr. Dockerfile docker-entrypoint).
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ilgi async job'ai (transkripcija) - didesni timeout'ai nei numatyti 60s.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Didelių audio failų upload (iki MAX_UPLOAD_MB backend'e).
        client_max_body_size 550M;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}

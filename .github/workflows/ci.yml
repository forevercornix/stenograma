name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CodeQL (actions/missing-workflow-permissions): be eksplicitinio bloko
# GITHUB_TOKEN gauna repo numatytąsias teises, kurios gali būti write. Šis
# workflow tik skaito kodą ir leidžia testus - rašymo jam nereikia niekur.
# Nustatoma workflow lygiu, kad naujas job'as paveldėtų saugų numatytąjį.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Tikras Redis servisas reikalingas DVIEM integraciniams testams (abu
    # gated `!!process.env.REDIS_URL` - be šio serviso abu visada skip):
    #   - tests/queueRecovery.integration.test.js (restart/stalled recovery)
    #   - tests/heartbeatReadiness.integration.test.js (worker heartbeat -> /api/ready)
    # Kiti Redis/BullMQ testai (tests/jobStoreRedis.test.js - naudoja FakeRedis;
    # tests/jobRunnerBullmq.test.js - mock'ina bullmq/ioredis) NĖRA gated per
    # REDIS_URL - jie vykdomi bendrame "Unit / route testai" žingsnyje BE šio
    # serviso, nepriklausomai nuo jo (žr. backend/README.md "Testai" - detalus
    # paaiškinimas, kuris testas ką TIKRAI naudoja).
    # Anksčiau CI neturėjo šio serviso - "žalias" testų rezultatas neįrodydavo, kad
    # BullMQ/Redis restart-recovery kelias realiai veikia, tik kad jis buvo praleistas.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # PostgreSQL migracijų testams (#155, 7.1). Kaip ir Redis - servisas
      # veikia VISAME job'e, bet `DATABASE_URL` perduodamas TIK migracijų
      # žingsniui: kiti testai jo nemato ir toliau naudoja in-memory store.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # EKSPLICITINIS Python, ne runner'io image prielaida (#202).
      #
      # `fasterWhisperEmbedded` ir `fasterWhisperConcurrency` naudoja mock
      # Python skriptus, tad reikia TIK interpretatoriaus - ne faster-whisper
      # modelio. Iki #202 jie rėmėsi tuo, kad `ubuntu-latest` python3 turi iš
      # anksto: prielaida šiandien teisinga, bet neužtikrinta - pasikeitus
      # image'ui testai imtų praleisti save, o job'as liktų ŽALIAS.
      #
      # Versija 3.11 - TA PATI kaip `pyannote-server` ir `whisper-server`
      # job'uose; trečia versija repo neįvedama.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Deterministinis diegimas (npm ci)
        run: npm ci

      - name: Sintaksės patikra (node --check)
        run: npm run check

      - name: Lint (ESLint - React hooks, nenaudoti kintamieji, nepasiekiamas kodas)
        run: npm run lint

      # SVARBU: šis žingsnis TYČIA neturi REDIS_URL. Dauguma route testų
      # (tests/jobs.route.test.js, tests/transcribeJobs.route.test.js,
      # tests/jobStore.test.js "be REDIS_URL naudojamas in-memory" ir kt.)
      # daro require("../server") ir tikisi INLINE vykdymo (job baigiasi tame
      # pačiame procese be worker'io). Jei REDIS_URL būtų nustatytas čia (o CI
      # Redis servisas realiai pasiekiamas), jobRunner automatiškai pereitų į
      # BullMQ režimą - jobai liktų amžinai "queued", nes šiuose testuose joks
      # worker'is jų neapdoroja. Tai buvo realus regresijos rizikos šaltinis,
      # kai REDIS_URL anksčiau buvo nustatytas VISAM `npm test` žingsniui.
      # Rinkiniai paleidžiami ATSKIRAI (#15), nors kartu jie sudaro tą patį
      # `npm test`. Priežastis praktinė: kai CI krinta, iš žingsnio pavadinimo
      # iškart matyti, ar lūžo privatumo garantija, ar tiekėjo formatavimas -
      # o ne tenka ieškoti vienoje 545 testų išvestyje.
      - name: Manifesto pilnumas (kiekvienas testas turi rinkinį)
        run: npm run test:suites

      # Matrica be patikros ilgainiui virsta sąrašu to, ką kažkada turėjom (#15).
      - name: Saugumo matrica atitinka tikrovę
        run: npm run test:matrix

      # Momentinė kopija PRIEŠ testus - po jų tikrinsim, ar nieko neliko.
      - name: Švaros momentinė kopija
        run: node scripts/verify-clean.mjs --snapshot

      - name: Privatumo regresijos testai
        run: npm run test:privacy

      - name: Saugumo regresijos testai
        run: npm run test:security

      - name: Funkciniai testai
        env:
          # REQUIRE_PYTHON=1 paverčia TYLŲ praleidimą klaida (#202) - ta pati
          # taisyklė kaip REQUIRE_REDIS (#15) ir REQUIRE_POSTGRES (#155, 7.1).
          #
          # Be jo dingęs python3 duotų 9 praleistus testus ir žalią job'ą:
          # padengimo iliuziją, kuri blogesnė nei testų nebuvimas.
          REQUIRE_PYTHON: "1"
        run: npm run test:functional

      # ATSKIRAS žingsnis TIK realaus Redis/BullMQ integraciniams testams
      # (tests/queueRecovery.integration.test.js - restart/stalled recovery;
      # tests/heartbeatReadiness.integration.test.js - worker heartbeat -> /api/ready
      # per TIKRĄ Redis) - abu PATYS patikrina process.env.REDIS_URL ir skip'ina
      # save, jei nenustatytas, tad čia REDIS_URL saugu nustatyti TIK šiam
      # žingsniui, neliečiant likusių (route testų) žingsnio aukščiau.
      - name: Redis/BullMQ integraciniai testai (restart/stalled recovery + heartbeat readiness su tikru Redis)
        env:
          REDIS_URL: redis://localhost:6379
          # REQUIRE_REDIS=1 paverčia TYLŲ praleidimą klaida (#15).
          #
          # Be jo dingęs REDIS_URL (env pervadinimas, servisas nepakilo,
          # workflow refaktoringas) reikštų, kad testai praleidžia save, o
          # job'as lieka ŽALIAS nieko nepatikrinęs. Prarasti dabar galima tik
          # abu vienu metu - o tai jau matomas pakeitimas, ne atsitiktinumas.
          REQUIRE_REDIS: "1"
        run: npm run test:redis

      - name: PostgreSQL testai (migracijos, postgresStore kontraktas, CHECK invariantai)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # REQUIRE_POSTGRES=1 paverčia TYLŲ praleidimą klaida - kitaip CI
          # liktų žalias niekada nepaleidęs nė vieno DB testo.
          REQUIRE_POSTGRES: "1"
        # ⚠️ `--tap-dir` = KIEKVIENAS FAILAS ATSKIRU PROCESU (#155, 7.4f / #231).
        #
        # Vien exit kodo nepakanka: `test:postgres` grąžina 0 ir tada, kai visi
        # testai praleido save dėl trūkstamo `DATABASE_URL`.
        #
        # Bet ir vieno bendro TAP nepakanka. Node 18 `node --test <failai>` duoda
        # PLOKŠČIĄ srautą be failų vardų, tad iš jo įmanoma įrodyti tik „kažkas
        # rinkinyje vykdyta". Failas, nutilęs dėl klaidingo importo, tokį
        # tikrinimą praeitų, jei kiti sukasi - o #231 reikalauja įrodymo
        # KIEKVIENAM failui.
        #
        # Todėl kiekvienas failas paleidžiamas atskirai, o jo TAP rašomas į
        # `/tmp/pg-tap/<vardas>.tap`. Atributika yra failo vardas, tad ji
        # nepriklauso nuo Node versijos ar reporterio formato. Kaina -
        # prarandamas lygiagretumas; rinkinys tam pakankamai mažas.
        #
        # ⚠️ BE PIPE IR BE `PIPESTATUS`. Ankstesnė versija naudojo
        # `... | tee ...; exit "${PIPESTATUS[0]}"` - ji teisinga su dabartiniu
        # numatytuoju `bash -e`, bet priklauso nuo shell nustatymo: pakeitus
        # `shell:` reikšmę kritusi rinktinė galėtų tyliai tapti žalia. Tai
        # tiksliai ta tylaus sulūžimo rūšis, kurios visas šis žingsnis ir vengia.
        #
        # `|| status=$?` reikalingas dėl `set -e`: be jo skriptas nutrūktų dar
        # neparodęs TAP, ir CI loge nebūtų matyti, KURIS testas krito.
        run: |
          status=0
          npm run test:postgres -- --tap-dir=/tmp/pg-tap || status=$?
          exit "$status"

      - name: PostgreSQL testai TIKRAI vykdyti (ne praleisti)
        working-directory: backend
        # ⚠️ ATSKIRAS ŽINGSNIS, ne dalis ankstesnio.
        #
        # Skriptas reikalauja NEPRALEISTO `ok` KIEKVIENAM išvesto postgres
        # rinkinio failui - trūkstamas `<vardas>.tap` arba TAP be nė vieno `ok`
        # yra klaida. Be šio žingsnio tikrintuvas būtų skriptas, kurio niekas
        # nekviečia, o nuo šios garantijos priklauso 7.4b/7.4c/7.4d/7.4e
        # uždarymas.
        run: node scripts/verify-postgres-suite-ran.mjs /tmp/pg-tap

      # Testas, kuris po savęs nesutvarko, ilgainiui slepia tikrus nutekėjimus:
      # kai /tmp pilnas senų artefaktų, niekas nebemato, kad produkcinis kodas
      # kažko neištrina.
      - name: Švara po testų (jokių likusių artefaktų)
        run: npm run test:clean

      - name: Smoke test - paleisti serverį ir patikrinti /api/health
        env:
          TRANSCRIPTION_PROVIDER: mock
          LLM_PROVIDER: mock
          NODE_ENV: test
          PORT: 3001
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3001/api/ready; then
              echo "Backend atsakė sėkmingai"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Backend neatsakė per 10s"
          kill $SERVER_PID
          exit 1

  frontend:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Deterministinis diegimas (npm ci)
        run: npm ci

      # Job jau turi defaults.run.working-directory: frontend.
      - name: Vitest - saugumo/privatumo testai (XSS, eksporto variantai)
        run: npm run test:security

      - name: Unit testai (Vitest)
        run: npm test

      - name: Lint (ESLint - React hooks deps, nenaudoti importai)
        run: npm run lint

      - name: Build (vite build)
        env:
          VITE_BACKEND_URL: http://localhost:3001
        run: npm run build

  pyannote-server:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pyannote-server

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Diegti TIK lengvas priklausomybes (be pyannote/torch modelio)
        # Sąmoningai NEDIEGIAME pyannote.audio/torch (~GB, reikia GPU realiam darbui) -
        # mock testai (test_server.py, test_diarize_integration.py) tikrina /health
        # diagnostiką IR /diarize kontraktą su MOCK pipeline, kuriems modelio nereikia.
        # test_real_gpu.py automatiškai praleidžiamas be HUGGINGFACE_TOKEN.
        run: pip install fastapi "httpx>=0.27" python-multipart pytest

      - name: Pyannote kontrakto testai (mock pipeline - /health + /diarize {turns:[...]})
        # test_diarize_integration.py BŪTENT tikrina tą kontraktą, kurio trūkumas
        # (serveris neegzistavo) sukėlė realią diarizacijos klaidą vartotojui.
        run: pytest test_server.py test_diarize_integration.py -v

  whisper-server:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: whisper-server

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Diegti TIK lengvas priklausomybes (be faster-whisper modelio)
        # Sąmoningai NEDIEGIAME faster-whisper (modelis + CUDA bibliotekos) - mock
        # testai tikrina /health diagnostiką IR /transcribe {text,segments} kontraktą
        # su MOCK modeliu, kuriems tikro modelio nereikia.
        run: pip install fastapi "httpx>=0.27" python-multipart pytest

      - name: Whisper kontrakto testai (mock modelis - /health + /transcribe {text,segments})
        # test_transcribe_integration.py tikrina tą patį kontraktą, kurio trūkumas
        # (serverio realizacijos nebuvo) būtų sukėlęs transkribavimo klaidą server profilyje.
        run: pytest test_server.py test_transcribe_integration.py test_stream_integration.py -v

  e2e:
    runs-on: ubuntu-latest
    # E2E ilgesnis: paleidžia du serverius ir naršyklę (#16).
    timeout-minutes: 30
    # E2E paleidžia TIKRĄ backend'ą (mock provideriais) + frontend ir per naršyklę
    # atlieka pilną vartotojo srautą: įklijuoti tekstą -> generuoti protokolą ->
    # eksportuoti DOCX. Būtent ši testų klasė anksčiau buvo "NOT verified".
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Backend priklausomybės (Playwright webServer jį paleidžia mock režimu).
      - name: Diegti backend priklausomybes
        working-directory: backend
        run: npm ci

      - name: Diegti frontend priklausomybes
        working-directory: frontend
        run: npm ci

      # Chromium naršyklė E2E testams (CI aplinkoje prieinama; sandbox'e - ne).
      - name: Diegti Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E testai (mock provideriai - pilnas srautas per naršyklę)
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      # Nesėkmės atveju - įkelti trace/screenshot artefaktus diagnostikai.
      - name: Įkelti Playwright ataskaitą (jei nepavyko)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          # Ataskaitose būna ekrano nuotraukų ir tinklo pėdsakų iš E2E srauto.
          # Testai naudoja tik mock tiekėjus ir sintetinį tekstą, bet retencija
          # vis tiek trumpa: artefaktas, gyvenantis 90 d. (numatytoji reikšmė),
          # yra kopija, apie kurią niekas neprisimena (#16).
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: docker compose build (backend + frontend image build patikra)
        run: docker compose build

      - name: Smoke test - paleisti per docker compose ir patikrinti /api/health
        run: |
          docker compose up -d backend
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/ready; then
              echo "Backend konteineryje atsakė sėkmingai"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          echo "Backend konteineryje neatsakė per 40s"
          docker compose logs backend
          docker compose down
          exit 1

  # Validuoja GPU/server profilių docker-compose MERGE rezultatą - NEBANDO jų
  # realiai paleisti (GHA runner'is neturi GPU), bet `docker compose ... config`
  # neturi tokio apribojimo (tai tik YAML merge/validacija, ne konteinerių
  # paleidimas). BŪTINA, nes ankstesnėse šio projekto iteracijose būtent MERGE
  # semantika (ne kodo logika) sukėlė realias klaidas, kurios "žaliame" `config`
  # patikrinime būtų buvusios matomos iš karto:
  #   - trūkstamas `worker` servisas gpu.yml (BullMQ eilė be nieko, kas ją apdoroja);
  #   - `devices: []` NEPAŠALINDAVO paveldėtos GPU rezervacijos (Compose sujungia
  #     sąrašus PRIDEDAMAI, ne pakeičiant - reikėjo `!reset`/`!override`, žr.
  #     docker-compose.server.yml komentarus).
  #
  # Naudojam `config --format json` + Python STANDARTINĘ `json` biblioteką (NE
  # PyYAML) - dviem priežastims: (1) neprireikia jokios papildomos pip
  # priklausomybės (GHA `ubuntu-latest` runner'is jau turi sistemos python3);
  # (2) JSON išvestis jau PILNAI IŠSPRĘSTA (be `!reset`/`!override` custom YAML
  # tag'ų, kurių bendras YAML parseris - pvz. PyYAML - apskritai NEATPAŽINTŲ be
  # papildomo custom loader'io).
  compose-config-validate:
    runs-on: ubuntu-latest
    # Be ribos pakibęs runner'is laikytų eilę užimtą iki 6 val. numatytojo limito (#16).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ⚠️ `POSTGRES_PASSWORD` neturi numatytosios reikšmės (`:?` compose faile),
      # kad tuščias slaptažodis niekada nepatektų į produkciją. Todėl net
      # `docker compose config` be jo krinta.
      #
      # Čia tikrinama tik SINTAKSĖ, tad fiktyvi reikšmė sąžininga — ji niekur
      # nesijungia. Tas pats principas kaip `services.postgres` job'e aukščiau.
      - name: docker compose config - GPU profilis (embedded)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --format json > /tmp/gpu-compose.json
          # ⚠️ NESPAUSDINAM. Sujungtoje konfigūracijoje yra DATABASE_URL su
          # slaptažodžiu, o job'o logas viešas. Klaidos atveju žr. artefaktą.
          jq -r '.services | keys[]' /tmp/gpu-compose.json

      - name: docker compose config - server profilis (whisper-server + pyannote-server)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.server.yml config --format json > /tmp/server-compose.json
          jq -r '.services | keys[]' /tmp/server-compose.json

      - name: PostgreSQL paritetas abiejuose profiliuose (#155, 7.1)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          python3 - <<'PYEOF'
          import json, sys

          # ⚠️ TIKRINAMA PO COMPOSE MERGE, ne YAML failuose atskirai.
          #
          # `server.yml` PERRAŠO `backend`, `transcription-worker` ir
          # `protocol-worker`, ir jo `depends_on` sąrašuose `postgres` NĖRA.
          # Compose ilgąją sintaksę turėtų sulieti, bet be šios patikros
          # prielaida netikrinama - o pakeitus sintaksę į trumpąją
          # priklausomybė dingtų tyliai.
          klaidos = []

          for profilis, kelias in [
              ("gpu", "/tmp/gpu-compose.json"),
              ("server", "/tmp/server-compose.json"),
          ]:
              with open(kelias) as f:
                  svc = json.load(f)["services"]

              if "postgres" not in svc:
                  klaidos.append(f"{profilis}: postgres serviso NĖRA po merge")
                  continue

              # Tas pats image abiejuose - kitaip po kelių mėnesių turėsime
              # skirtingas versijas skirtinguose profiliuose.
              img = svc["postgres"].get("image", "")
              if not img.startswith("postgres:16"):
                  klaidos.append(f"{profilis}: netikėtas postgres image: {img}")

              if not svc["postgres"].get("healthcheck"):
                  klaidos.append(f"{profilis}: postgres be healthcheck")

              for vardas in ("backend", "transcription-worker", "protocol-worker"):
                  if vardas not in svc:
                      continue
                  env = svc[vardas].get("environment") or {}
                  # `PG*` kintamieji, ne sukonstruotas URL: slaptažodis su URI
                  # simboliais URL'e reikštų kitką.
                  # ⚠️ TIK `backend` gauna DB kredencialus (7.1).
                  #
                  # Worker'iai PostgreSQL nenaudoja - migracijos ir diagnostika
                  # vykdomos backend'e. Duoti jiems DB inicializacijos
                  # kredencialus reikštų, kad worker'io kompromitacija leidžia
                  # keisti DB be jokios funkcinės priežasties.
                  #
                  # 7.2a metu worker'iai gaus ATSKIRĄ mažiausios privilegijos
                  # rolę, ir ši patikra pasikeis.
                  if vardas == "backend":
                      trūkstami = [k for k in ("PGHOST", "PGUSER", "PGPASSWORD", "PGDATABASE")
                                   if k not in env]
                      if trūkstami:
                          klaidos.append(f"{profilis}/{vardas}: trūksta {', '.join(trūkstami)}")
                  else:
                      pertekliniai = [k for k in ("PGPASSWORD", "PGUSER") if k in env]
                      if pertekliniai:
                          klaidos.append(
                              f"{profilis}/{vardas}: TURI {', '.join(pertekliniai)}, "
                              "bet PostgreSQL nenaudoja (mažiausia privilegija)"
                          )

                  # ⚠️ `depends_on: postgres` SĄMONINGAI NĖRA (7.1).
                  #
                  # Nė vienas procesas PostgreSQL dar nenaudoja, tad migracijų
                  # infrastruktūros gedimas neturi išjungti viso stacko.
                  # Priklausomybė pridedama 7.2a - tada ši patikra apsiverčia.
                  dep = svc[vardas].get("depends_on") or {}
                  if "postgres" in dep:
                      klaidos.append(
                          f"{profilis}/{vardas}: depends_on TURI postgres, bet 7.1 metu "
                          "jo niekas nenaudoja - stackas kristų dėl nereikalingos DB"
                      )

          if klaidos:
              print("PostgreSQL paritetas PAŽEISTAS:")
              for k in klaidos:
                  print("  -", k)
              sys.exit(1)

          print("PostgreSQL paritetas: gpu ir server profiliai sutampa.")
          PYEOF

      - name: Bazinis profilis PostgreSQL NEPALEIDŽIA (#155, 7.1)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/base-compose.json
          python3 - <<'PYEOF'
          import json, sys

          # Desktop/demo režimas turi likti paleidžiamas BE infrastruktūros
          # (memoryStore). Postgres bazėje reikštų, kad "minimalus paleidimas"
          # nustoja būti minimalus.
          with open("/tmp/base-compose.json") as f:
              svc = json.load(f)["services"]

          if "postgres" in svc:
              print("Bazinis docker-compose.yml NETURI apibrėžti postgres.")
              sys.exit(1)

          for vardas, s in svc.items():
              env = s.get("environment") or {}
              for k in ("DATABASE_URL", "PGHOST", "PGPASSWORD"):
                  if k in env:
                      print(f"Bazinis profilis: {vardas} turi {k} - neturėtų.")
                      sys.exit(1)

          print("Bazinis profilis be PostgreSQL - kaip ir turi būti.")
          PYEOF

      - name: Patikrinti GPU/volume paskirstymą po merge (GPU profilis)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          python3 - <<'PYEOF'
          import json, sys

          with open("/tmp/gpu-compose.json") as f:
              cfg = json.load(f)
          svc = cfg["services"]

          def has_gpu(name):
              devices = (svc[name].get("deploy") or {}).get("resources", {}).get("reservations", {}).get("devices", [])
              return any(d.get("driver") == "nvidia" for d in devices)

          errors = []
          # Embedded GPU profilyje backend IR transcription-worker TURI turėti GPU
          # (sinchroniniai endpoint'ai ir embedded transkripcija - žr. docker-compose.gpu.yml).
          if not has_gpu("backend"):
              errors.append("GPU profilis: backend turi TURĖTI GPU (sinchroniniai /api/transcribe, /api/generate)")
          if not has_gpu("transcription-worker"):
              errors.append("GPU profilis: transcription-worker turi TURĖTI GPU (embedded faster-whisper)")
          if has_gpu("protocol-worker"):
              errors.append("GPU profilis: protocol-worker NETURI turėti GPU (tik LLM API kvietimas)")
          if not has_gpu("pyannote"):
              errors.append("GPU profilis: pyannote turi TURĖTI GPU")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("OK: GPU profilio GPU paskirstymas teisingas.")
          PYEOF

      - name: Patikrinti GPU/volume paskirstymą po merge (server profilis)
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          python3 - <<'PYEOF'
          import json, sys

          with open("/tmp/server-compose.json") as f:
              cfg = json.load(f)
          svc = cfg["services"]

          def has_gpu(name):
              devices = (svc[name].get("deploy") or {}).get("resources", {}).get("reservations", {}).get("devices", [])
              return any(d.get("driver") == "nvidia" for d in devices)

          def volume_targets(name):
              """Grąžina servisio volume TARGET (konteinerio) kelius, aibe.
              `docker compose config --format json` volumes visada JSON objektų
              sąrašas su `target` raktu (long syntax) - jokio short "source:target"
              string'o čia nebūna, tad papildomo string-parsing atvejo nereikia."""
              return {v.get("target", "") for v in (svc[name].get("volumes") or [])}

          errors = []
          # Server profilyje backend IR transcription-worker naudoja whisper-server
          # per HTTP - GPU jiems NEBEREIKIA (!reset override turi tai pašalinti).
          if has_gpu("backend"):
              errors.append("Server profilis: backend NETURI turėti GPU (naudoja whisper-server per HTTP) - !reset override neveikė!")
          if has_gpu("transcription-worker"):
              errors.append("Server profilis: transcription-worker NETURI turėti GPU (naudoja whisper-server per HTTP) - !reset override neveikė!")
          if has_gpu("protocol-worker"):
              errors.append("Server profilis: protocol-worker NETURI turėti GPU")
          if not has_gpu("whisper"):
              errors.append("Server profilis: whisper servisas TURI turėti GPU")

          # /storage turi išlikti (audio worker'iui), /models NETURI likti backend/
          # transcription-worker servisuose (!override turi jį pašalinti - modelis
          # server profilyje gyvena TIK whisper servise).
          for name in ("backend", "transcription-worker"):
              targets = volume_targets(name)
              if "/storage" not in targets:
                  errors.append(f"Server profilis: {name} turi turėti /storage volume")
              if "/models" in targets:
                  errors.append(f"Server profilis: {name} NETURI turėti /models volume (!override neveikė?) - rasti targets: {targets}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("OK: server profilio GPU/volume paskirstymas teisingas.")
          PYEOF

  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Politika, kurios niekas netikrina, galioja tik tol, kol visi ją prisimena.
    # Šis job'as paverčia docs/ci-security-policy.md taisykles vykdomomis (#16).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Įdiegti YAML parserį
        working-directory: backend
        run: npm ci

      - name: Tikrinti workflow saugumo politiką
        run: node scripts/check-workflow-policy.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR BLOKUOJANTIS auditas (#16).
    #
    # Dependabot NĖRA tas pats: jis periodiškai siūlo atnaujinimus, bet
    # nepatikrina PR, kuris ĮVEDA žinomai pažeidžiamą priklausomybę. Be šio
    # job'o nauja pažeidžiamybė patektų į main ir lauktų savaitinio ciklo.
    #
    # RIBA SKIRIASI PAGAL EKOSISTEMĄ (žr. docs/ci-security-policy.md):
    #   npm    - high ir critical stabdo; moderate ir low rodomi, neblokuoja.
    #   Python - BET KOKS radinys stabdo.
    #
    # `pip-audit` severity slenksčio neturi (`--strict` keičia priklausomybių
    # surinkimo klaidų traktavimą, ne sunkumo ribą). Suvienodinti reikštų rašyti
    # JSON filtrą, o Python advisory šaltiniai sunkumą pateikia nevienodai - tad
    # filtras būtų tikslus tik iš pažiūros. Griežtesnė taisyklė sąžiningesnė.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: JavaScript auditas (backend)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: JavaScript auditas (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Įdiegti pip-audit
        run: pip install pip-audit

      # Python auditas kiekvienam katalogui atskirai: jie turi skirtingus
      # requirements ir gali būti diegiami nepriklausomai.
      # `--strict` lieka: jis stabdo ir tada, kai priklausomybių išvis nepavyko
      # surinkti - tyliai praleistas katalogas atrodytų kaip švarus auditas.
      - name: Python auditas (backend/scripts) - blokuoja BET KOKS radinys
        run: pip-audit --requirement backend/scripts/requirements.txt --strict

      - name: Python auditas (pyannote-server) - blokuoja BET KOKS radinys
        # LAIKINA IŠIMTIS: PYSEC-2026-3624 / CVE-2026-58659
        #
        # lightning <= 2.6.5 turi nuotolinio kodo vykdymo spragą
        # `_load_state` funkcijoje: kenkėjiškas checkpoint failas per
        # `_instantiator` hiperparametrus priverčia importuoti ir įvykdyti
        # bet kokį modulį, apeinant `weights_only=True` apsaugą, kai
        # kviečiama `LightningModule.load_from_checkpoint`.
        #
        # KODĖL IŠIMTIS, O NE ATNAUJINIMAS: pataisymas egzistuoja tik
        # commit'e d710d68 (PR Lightning-AI/pytorch-lightning#21832), bet į
        # išleistą versiją dar nepateko. PyPI naujausia `lightning` versija
        # 2026-08-10 tebėra 2.6.5 — atnaujinti NĖRA Į KĄ. Priklausomybė
        # ateina tranzityviai per `pyannote.audio`, ne tiesiogiai.
        #
        # POVEIKIS STENOGRAMA: checkpoint'ai kraunami tik iš konfigūracijoje
        # įvardyto HuggingFace modelio; vartotojas savo checkpoint failo
        # pateikti negali. Tai supply-chain vektorius (jei būtų pakeistas
        # modelis HF pusėje), ne tiesioginis vartotojo įvedamas kelias.
        # Tai rizikos vertinimas, ne garantija.
        #
        # PANAIKINTI, kai bus išleista lightning > 2.6.5. Patikrinti:
        #   curl -s https://pypi.org/pypi/lightning/json \
        #     | grep -o '"version":"[^"]*"' | head -1
        run: |
          pip-audit --requirement pyannote-server/requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3624

      - name: Python auditas (whisper-server) - blokuoja BET KOKS radinys
        run: pip-audit --requirement whisper-server/requirements.txt --strict
